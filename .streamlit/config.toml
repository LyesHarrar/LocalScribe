[theme]
base = "dark"
primaryColor = "#2e74fd"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#0b1120"
textColor = "#f8fafc"
font = "sans serif"

[server]
headless = true
port = 8501
maxUploadSize = 4096

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
